    // 测试逻辑
    document.addEventListener('DOMContentLoaded', function() {
        // 页面元素
        const introPage = document.getElementById('intro-page');
        const testPage = document.getElementById('test-page');
        const resultPage = document.getElementById('result-page');
        const startBtn = document.getElementById('start-test');
        const restartBtn = document.getElementById('restart-test');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const questionText = document.getElementById('question-text');
        const answerOptions = document.getElementById('answer-options');
        const questionCounter = document.getElementById('question-counter');
        const progressPercentage = document.getElementById('progress-percentage');
        const progressBar = document.getElementById('progress-bar');
        const resultName = document.getElementById('result-name');
        const resultEvaluation = document.getElementById('result-evaluation');
        const resultBio = document.getElementById('result-bio');
        const resultCount = document.getElementById('result-count');

        // 测试状态
        let currentQuestion = 0;
        const userAnswers = new Array(questions.length).fill(null);

        // 开始测试
        startBtn.addEventListener('click', function() {
            introPage.classList.add('hidden');
            testPage.classList.remove('hidden');
            loadQuestion(currentQuestion);
        });

        // 重新测试
        restartBtn.addEventListener('click', function() {
            resultPage.classList.add('hidden');
            introPage.classList.remove('hidden');
            currentQuestion = 0;
            userAnswers.fill(null);
            progressBar.style.width = '0%';
            progressPercentage.textContent = '0%';
        });

        // 上一题
        prevBtn.addEventListener('click', function() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion(currentQuestion);
                updateNavigation();
            }
        });

        // 下一题
        nextBtn.addEventListener('click', function() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion(currentQuestion);
                updateNavigation();
            } else {
                // 完成测试，计算结果
                calculateResult();
                testPage.classList.add('hidden');
                resultPage.classList.remove('hidden');
            }
        });

        // 加载问题
        function loadQuestion(index) {
            const question = questions[index];
            questionText.textContent = question.text;
            questionCounter.textContent = `问题 ${question.id}/30`;

            // 清空选项
            answerOptions.innerHTML = '';

            // 添加选项
            question.options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = `p-3 border rounded-lg cursor-pointer hover:bg-gray-50 ${userAnswers[index] === option.value ? 'option-selected' : ''}`;
                optionDiv.textContent = option.text;
                optionDiv.addEventListener('click', function() {
                    userAnswers[index] = option.value;
                    // 更新选项样式
                    document.querySelectorAll('#answer-options > div').forEach(el => {
                        el.classList.remove('option-selected');
                    });
                    optionDiv.classList.add('option-selected');
                    // 启用下一题按钮
                    nextBtn.disabled = false;
                });
                answerOptions.appendChild(optionDiv);
            });

            // 更新进度
            const progress = ((index + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressPercentage.textContent = `${Math.round(progress)}%`;
        }

        // 更新导航按钮状态
        function updateNavigation() {
            prevBtn.disabled = currentQuestion === 0;
            nextBtn.disabled = userAnswers[currentQuestion] === null;

            // 如果是最后一题，更改按钮文本
            if (currentQuestion === questions.length - 1) {
                nextBtn.textContent = '查看结果';
            } else {
                nextBtn.textContent = '下一题';
            }
        }

        // 计算测试结果
        function calculateResult() {
            // 找出与用户答案最匹配的人物
            let bestMatch = null;
            let bestScore = Infinity;

            characters.forEach(character => {
                let score = 0;
                // 计算欧氏距离
                for (let i = 0; i < userAnswers.length; i++) {
                    score += Math.pow(userAnswers[i] - character.traits[i], 2);
                }
                // 取平方根
                score = Math.sqrt(score);

                // 更新最佳匹配
                if (score < bestScore) {
                    bestScore = score;
                    bestMatch = character;
                }
            });
            
            // 更新匹配次数
            bestMatch.count++;

            // 显示结果
            resultName.textContent = bestMatch.name;
            resultEvaluation.textContent = bestMatch.evaluation;
            resultBio.textContent = bestMatch.bio;
            resultCount.textContent = `已有 ${bestMatch.count} 人与你拥有相同的民国人格`;
        }
    });
</script>
