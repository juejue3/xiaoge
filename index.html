    // 全局变量
    let currentQuestion = 0;
    let userAnswers = []; // 存储用户选择的选项序号（1-5）
    let resultCharacter = null;
    let similarityPercent = 0; // 匹配相似度百分比

    // DOM元素获取
    const introPage = document.getElementById('intro-page');
    const testPage = document.getElementById('test-page');
    const resultPage = document.getElementById('result-page');
    const startTestBtn = document.getElementById('start-test');
    const restartTestBtn = document.getElementById('restart-test');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const questionText = document.getElementById('question-text');
    const answerOptions = document.getElementById('answer-options');
    const questionCounter = document.getElementById('question-counter');
    const progressPercentage = document.getElementById('progress-percentage');
    const progressBar = document.getElementById('progress-bar');
    const resultName = document.getElementById('result-name');
    const resultEvaluation = document.getElementById('result-evaluation');
    const resultBio = document.getElementById('result-bio');
    const resultCount = document.getElementById('result-count');
    const similarityFill = document.getElementById('similarity-fill');
    const similarityPercentText = document.getElementById('similarity-percent');

    // 初始化函数
    function init() {
        // 加载本地存储的人物匹配计数
        const savedCounts = localStorage.getItem('characterCounts');
        if (savedCounts) {
            const counts = JSON.parse(savedCounts);
            characters.forEach(char => {
                if (counts[char.id]) {
                    char.count = counts[char.id];
                }
            });
        }
        
        // 绑定事件监听
        startTestBtn.addEventListener('click', startTest);
        restartTestBtn.addEventListener('click', restartTest);
        prevBtn.addEventListener('click', showPrevQuestion);
        nextBtn.addEventListener('click', showNextQuestion);
    }

    // 开始测试
    function startTest() {
        introPage.classList.add('hidden');
        testPage.classList.remove('hidden');
        currentQuestion = 0;
        userAnswers = new Array(questions.length).fill(0);
        showQuestion(currentQuestion);
        updateProgress();
    }

    // 重新测试
    function restartTest() {
        resultPage.classList.add('hidden');
        introPage.classList.remove('hidden');
        currentQuestion = 0;
        userAnswers = [];
        resultCharacter = null;
        similarityPercent = 0;
    }

    // 显示指定题号的问题
    function showQuestion(index) {
        const question = questions[index];
        questionText.textContent = question.text;
        answerOptions.innerHTML = '';
        
        // 渲染选项
        question.options.forEach((option, optIndex) => {
            const optionElement = document.createElement('div');
            optionElement.className = 'flex items-center';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'answer';
            radio.id = `option-${optIndex}`;
            radio.value = option.value;
            radio.className = 'mr-2';
            
            // 恢复已选答案
            if (userAnswers[index] == option.value) {
                radio.checked = true;
            }
            
            // 绑定选择事件
            radio.addEventListener('change', () => {
                userAnswers[index] = parseInt(option.value);
            });
            
            const label = document.createElement('label');
            label.htmlFor = `option-${optIndex}`;
            label.className = 'flex-1 p-2 border border-gray-300 rounded-lg hover:bg-primary/5 cursor-pointer text-sm';
            label.textContent = option.text;
            
            optionElement.appendChild(radio);
            optionElement.appendChild(label);
            answerOptions.appendChild(optionElement);
        });
        
        // 更新按钮状态
        prevBtn.disabled = index === 0;
        nextBtn.textContent = index === questions.length - 1 ? '查看结果' : '下一题';
        
        // 更新问题计数器
        questionCounter.textContent = `问题 ${index + 1}/${questions.length}`;
    }

    // 上一题
    function showPrevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            showQuestion(currentQuestion);
            updateProgress();
        }
    }

    // 下一题/查看结果
    function showNextQuestion() {
        // 验证是否选择答案（最后一题除外）
        if (userAnswers[currentQuestion] === 0 && currentQuestion < questions.length - 1) {
            alert('请选择一个答案！');
            return;
        }
        
        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            showQuestion(currentQuestion);
            updateProgress();
        } else {
            // 计算匹配结果（核心优化：相似度算法）
            calculateSimilarity();
            // 显示结果页面
            showResult();
        }
    }

    // 更新进度条
    function updateProgress() {
        const percent = ((currentQuestion + 1) / questions.length) * 100;
        progressBar.style.width = `${percent}%`;
        progressPercentage.textContent = `${Math.round(percent)}%`;
    }

    // 核心优化：相似度计算算法（多维度加权匹配）
    function calculateSimilarity() {
        let maxSimilarity = 0;
        let bestMatch = null;
        
        // 题型权重（核心人格题权重更高）
        const questionWeights = [
            1.2, 1.5, 1.2, 1.0, 1.3, 1.0, 1.4, 1.5, 1.2, 1.4,
            1.0, 1.0, 1.1, 1.2, 1.3, 1.1, 1.2, 1.0, 1.4, 1.0
        ];
        
        // 遍历所有人物计算相似度
        characters.forEach(char => {
            let totalScore = 0;
            let maxPossibleScore = 0;
            
            // 逐题计算相似度得分
            for (let i = 0; i < userAnswers.length; i++) {
                const userAns = userAnswers[i];
                const charAns = char.standardAnswers[i];
                const weight = questionWeights[i];
                
                // 完全匹配得满分，差值越大得分越低
                const diff = Math.abs(userAns - charAns);
                const score = (5 - diff) * weight; // 单题得分（0-5*权重）
                totalScore += score;
                
                // 单题满分
                maxPossibleScore += 5 * weight;
            }
            
            // 计算相似度百分比
            const similarity = (totalScore / maxPossibleScore) * 100;
            
            // 找到相似度最高的人物
            if (similarity > maxSimilarity) {
                maxSimilarity = similarity;
                bestMatch = char;
            }
        });
        
        // 保存结果
        resultCharacter = bestMatch;
        similarityPercent = Math.round(maxSimilarity);
        
        // 更新匹配计数
        resultCharacter.count += 1;
        
        // 保存计数到本地存储
        const countsObj = {};
        characters.forEach(char => {
            countsObj[char.id] = char.count;
        });
        localStorage.setItem('characterCounts', JSON.stringify(countsObj));
    }

    // 显示匹配结果
    function showResult() {
        testPage.classList.add('hidden');
        resultPage.classList.remove('hidden');
        
        // 填充结果信息
        resultName.textContent = resultCharacter.name;
        resultEvaluation.textContent = resultCharacter.evaluation;
        resultBio.textContent = resultCharacter.bio;
        resultCount.textContent = `已有 ${resultCharacter.count} 人匹配到该人物`;
        
        // 动态展示相似度进度条
        similarityFill.style.width = `${similarityPercent}%`;
        similarityPercentText.textContent = `${similarityPercent}%`;
        
        // 相似度文案优化
        let similarityDesc = '';
        if (similarityPercent >= 90) {
            similarityDesc = '（高度契合）';
        } else if (similarityPercent >= 70) {
            similarityDesc = '（契合度高）';
        } else if (similarityPercent >= 50) {
            similarityDesc = '（较契合）';
        } else {
            similarityDesc = '（有一定契合度）';
        }
        similarityPercentText.textContent = `${similarityPercent}% ${similarityDesc}`;
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);
</script>
