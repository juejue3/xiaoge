        },
        {

            options: [

            ]
        },
        {
            id: 19,
            text: "当理想与现实产生冲突时，你会：",
            options: [
                { text: "坚守理想，不惜对抗现实", value: 5 },
                { text: "平衡兼顾，坚持理想并适配现实", value: 4 },
                { text: "务实为先，先解决现实再追理想", value: 3 },
                { text: "适度妥协，接受现实并调整理想", value: 2 },
                { text: "放弃理想，完全向现实妥协", value: 1 }
            ]
        },
        {
            id: 20,
            text: "你对金钱与权力的态度是：",
            options: [
                { text: "追求权力，以此实现远大抱负", value: 5 },
                { text: "积累财富，用于回馈社会", value: 4 },
                { text: "够用即可，平衡物质与生活", value: 3 },
                { text: "看淡名利，追求精神自由", value: 2 },
                { text: "知足常乐，重视精神富足", value: 1 }
            ]
        }
    ];

    // 全局变量
    let currentQuestion = 0;
    let answers = [];
    let resultCharacter = null;

    // DOM元素
    const introPage = document.getElementById('intro-page');
    const testPage = document.getElementById('test-page');
    const resultPage = document.getElementById('result-page');
    const startTestBtn = document.getElementById('start-test');
    const restartTestBtn = document.getElementById('restart-test');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const questionText = document.getElementById('question-text');
    const answerOptions = document.getElementById('answer-options');
    const questionCounter = document.getElementById('question-counter');
    const progressPercentage = document.getElementById('progress-percentage');
    const progressBar = document.getElementById('progress-bar');

    // 初始化
    function init() {
        // 加载本地存储的人物计数
        const savedCounts = localStorage.getItem('characterCounts');
        if (savedCounts) {
            const counts = JSON.parse(savedCounts);
            characters.forEach(char => {
                if (counts[char.id]) {
                    char.count = counts[char.id];
                }
            });
        }
        // 绑定事件
        startTestBtn.addEventListener('click', startTest);
        restartTestBtn.addEventListener('click', restartTest);
        prevBtn.addEventListener('click', showPrevQuestion);
        nextBtn.addEventListener('click', showNextQuestion);
    }

    // 开始测试
    function startTest() {
        introPage.classList.add('hidden');
        testPage.classList.remove('hidden');
        currentQuestion = 0;
        answers = new Array(questions.length).fill(0);
        showQuestion(currentQuestion);
        updateProgress();
    }

    // 重新测试
    function restartTest() {
        resultPage.classList.add('hidden');
        introPage.classList.remove('hidden');
        currentQuestion = 0;
        answers = [];
        resultCharacter = null;
    }

    // 显示问题
    function showQuestion(index) {
        const question = questions[index];
        questionText.textContent = question.text;
        answerOptions.innerHTML = '';
        question.options.forEach((option, optIndex) => {
            const optionElement = document.createElement('div');
            optionElement.className = 'flex items-center';
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'answer';
            radio.id = `option-${optIndex}`;
            radio.value = option.value;
            radio.className = 'mr-2';
            if (answers[index] == option.value) {
                radio.checked = true;
            }
            radio.addEventListener('change', () => {
                answers[index] = parseInt(option.value);
            });
            const label = document.createElement('label');
            label.htmlFor = `option-${optIndex}`;
            label.className = 'flex-1 p-2 border border-gray-300 rounded-lg hover:bg-primary/5 cursor-pointer text-sm';
            label.textContent = option.text;
            optionElement.appendChild(radio);
            optionElement.appendChild(label);
            answerOptions.appendChild(optionElement);
        });
        // 更新按钮状态
        prevBtn.disabled = index === 0;
        nextBtn.textContent = index === questions.length - 1 ? '查看结果' : '下一题';
        // 更新计数器
        questionCounter.textContent = `问题 ${index + 1}/${questions.length}`;
    }

    // 上一题
    function showPrevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            showQuestion(currentQuestion);
            updateProgress();
        }
    }

    // 下一题
    function showNextQuestion() {
        // 检查是否选择了答案
        if (answers[currentQuestion] === 0 && currentQuestion < questions.length - 1) {
            alert('请选择一个答案！');
            return;
        }
        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            showQuestion(currentQuestion);
            updateProgress();
        } else {
            calculateResult();
            showResult();
        }
    }

    // 更新进度
    function updateProgress() {
        const percent = ((currentQuestion + 1) / questions.length) * 100;
        progressBar.style.width = `${percent}%`;
        progressPercentage.textContent = `${Math.round(percent)}%`;
    }

    // 优化后的匹配算法
    function calculateResult() {
        const dimensionWeights = [
            1.5, 1.4, 1.3, 1.2, 1.1, 1.0, 1.3, 1.0, 1.2, 1.5,
            1.0, 1.1, 1.0, 1.0, 1.4, 1.1, 1.2, 1.0, 1.3, 1.2
        ];

        let bestScore = Infinity;
        let bestMatch = null;

        characters.forEach(char => {
            let weightedScore = 0;
            for (let i = 0; i < answers.length; i++) {
                const diff = Math.abs(answers[i] - char.traits[i]);
                weightedScore += diff * dimensionWeights[i];
            }
            const traitMean = char.traits.reduce((sum, val) => sum + val, 0) / char.traits.length;
            const answerMean = answers.reduce((sum, val) => sum + val, 0) / answers.length;
            const meanDiff = Math.abs(traitMean - answerMean) * 2;
            const finalScore = weightedScore + meanDiff;

            if (finalScore < bestScore) {
                bestScore = finalScore;
                bestMatch = char;
            }
        });

        resultCharacter = bestMatch;
        resultCharacter.count++;
        const counts = {};
        characters.forEach(char => {
            counts[char.id] = char.count;
        });
        localStorage.setItem('characterCounts', JSON.stringify(counts));
    }

    // 显示结果（分离人格描述和人物简介）
    function showResult() {
        testPage.classList.add('hidden');
        resultPage.classList.remove('hidden');
        document.getElementById('result-name').textContent = resultCharacter.name;
        document.getElementById('result-icon').className = `fa ${resultCharacter.icon} text-4xl text-primary`;
        // 人格描述（单独展示）
        document.getElementById('result-evaluation').textContent = resultCharacter.evaluation;
        // 人物简介（小字展示）
        document.getElementById('result-bio').textContent = resultCharacter.bio;
        document.getElementById('result-count').textContent = `已有 ${resultCharacter.count} 人匹配到${resultCharacter.name}`;
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
</script>
