        </div>

            <div id="answer-options" class="space-y-3"></div>
        </div>

            </button>

    </div>

    <footer class="mt-8 text-center text-gray-600 text-xs">

        updateQuestion();
        updateProgress();

        introPage.classList.add('hidden');
        testPage.classList.remove('hidden');
        resultPage.classList.add('hidden');
    }

    // 更新题目内容
    function updateQuestion() {
        const question = questions[currentQuestion];
        questionText.textContent = question.text;
        answerOptions.innerHTML = '';

        // 生成选项按钮
        question.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'w-full text-left p-3 rounded-lg border border-secondary hover:bg-secondary/20 transition-all';

            // 如果已有答案，设置选中状态
            if (userAnswers[currentQuestion] === option.score) {
                btn.classList.add('option-selected');
            }

            btn.textContent = option.text;
            btn.dataset.score = option.score;

            // 选项点击事件
            btn.addEventListener('click', function() {
                // 清除其他选项的选中状态
                document.querySelectorAll('#answer-options button').forEach(b => {
                    b.classList.remove('option-selected');
                });

                // 设置当前选项为选中
                this.classList.add('option-selected');
                userAnswers[currentQuestion] = parseInt(this.dataset.score);

                // 启用下一题按钮
                nextBtn.disabled = false;
            });

            answerOptions.appendChild(btn);
        });

        // 更新按钮状态
        prevBtn.disabled = currentQuestion === 0;
        nextBtn.disabled = userAnswers[currentQuestion] === null;
    }

    // 更新进度条
    function updateProgress() {
        const progress = ((currentQuestion + 1) / questions.length) * 100;
        progressBar.style.width = `${progress}%`;
        questionCounter.textContent = `问题 ${currentQuestion + 1}/${questions.length}`;
        progressPercentage.textContent = `${Math.round(progress)}%`;
    }

    // 计算匹配结果
    function calculateResult() {
        // 计算用户总分特征向量
        const userVector = userAnswers;

        // 计算与每个人物的相似度（差值越小越匹配）
        let bestMatch = null;
        let minDifference = Infinity;

        characters.forEach(character => {
            const difference = character.traits.reduce((sum, trait, index) => {
                return sum + Math.abs(trait - userVector[index]);
            }, 0);

            if (difference < minDifference) {
                minDifference = difference;
                bestMatch = character;
            }
        });

        // 显示结果
        resultName.textContent = bestMatch.name;
        resultEvaluation.textContent = bestMatch.evaluation;
        resultBio.textContent = bestMatch.bio;
        resultCount.textContent = `已有 ${Math.floor(Math.random() * 10000) + 5000} 人与你拥有相同人格`;

        // 切换到结果页
        testPage.classList.add('hidden');
        resultPage.classList.remove('hidden');
    }

    // ========== 事件监听 ==========
    // 开始测试
    startBtn.addEventListener('click', initTest);

    // 重新测试
    restartBtn.addEventListener('click', initTest);

    // 上一题
    prevBtn.addEventListener('click', () => {
        if (currentQuestion > 0) {
            currentQuestion--;
            updateQuestion();
            updateProgress();
        }
    });

    // 下一题/完成测试
    nextBtn.addEventListener('click', () => {
        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            updateQuestion();
            updateProgress();
        } else {
            // 最后一题，计算结果
            calculateResult();
        }
    });
</script>
</body>
</html>
